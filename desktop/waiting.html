<!doctype html>
<html lang="zh-CN"
  ><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <title>Aieyra Control</title
  ><link rel="stylesheet" href="waiting.css" />
  <main
    ><div class="mark">A</div><p class="eyebrow">AIEYRA CONTROL</p
    ><h1 id="title">正在连接你的控制台</h1>
    <p id="detail" role="status" aria-live="polite">本地服务就绪后，项目与工位会在这里显示。</p>
    <div class="actions"
      ><button id="retry">重新连接</button><button id="quit" class="quiet">退出</button></div
    >
    <label><input type="checkbox" id="background" />关闭窗口后在后台运行，可从托盘重新打开</label>
    <p class="hint">后台运行由你选择。退出应用时，仅停止本应用启动的本地服务。</p></main
  >
  <script src="waiting.js"></script
></html>
