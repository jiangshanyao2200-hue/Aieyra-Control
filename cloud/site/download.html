<!doctype html>
<html lang="zh-CN">
  <head
    ><meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1" /><meta
      name="theme-color"
      content="#10191d" /><title>下载 · Aieyra Control</title

      rel="stylesheet"
      href="/style.css"
  /></head>
  <body data-page="download"
    ><div class="page-background" data-backgrounds aria-hidden="true"
      ><picture class="background-frame is-visible"
        ><source media="(max-width: 600px)" srcset="/assets/scene-07-small.webp" /><img
          src="/assets/scene-07.webp"
          width="1920"
          height="1080"
          alt=""
          fetchpriority="high" /></picture></div
    ><aside class="site-rail"
      ><a class="brand-mark" href="/" aria-label="Aieyra Control"
        ><svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            d="m5 15 11-6 11 6-11 6-11-6Zm0 0v7l11 6 11-6v-7M16 21v7M10 6l12 6v8L10 14V6Z"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linejoin="round"
          /></svg></a
      ><nav aria-label="主导航"
        ><a href="/" aria-label="首页"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 10 8-6 8 6v10H4V10Z M9 20v-7h6v7" /></svg
          ><span>首页</span></a
        ><a href="/center" aria-label="中心"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 4h16v12H9l-5 4V4Z M8 8h8 M8 12h5" /></svg
          ><span>中心</span></a
        ><a href="/download" aria-label="下载" aria-current="page"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" /></svg
          ><span>下载</span></a
        ></nav
      ><span class="rail-sign" aria-hidden="true">AC</span></aside
    ><main class="download-page"
      ><section class="download-copy"
        ><h1>现在就下载</h1><p class="download-note">体验新时代Agent协作。</p
        ><div class="release-meta"><span data-version>Windows</span><span data-size></span></div
        ><p class="download-identity" data-identity></p
        ><div class="download-actions" data-downloads></div
        ><p class="download-status" role="status">读取版本…</p
        ><button class="text-action" data-release-retry hidden>重试</button
        ><details class="release-details" data-release-details hidden
          ><summary>校验信息</summary><span>SHA-256</span><code data-hash></code></details
        ><details class="release-details" data-link-guide
          ><summary>用 Link 连接你的设备</summary
          ><p
            >Control 0.7 内置 Link。把 Link
            部署到自己的私人服务器，获取设备码，即可在“连接”中接入多台设备。也支持局域网、Wi-Fi 和
            USB 网络。</p
          ><p>无需官方云账号；只读办公室共享由你主动开启。USB 需要网络共享或端口隧道。</p
          ><a
            href="https://github.com/jiangshanyao2200-hue/Aieyra-Control/blob/main/docs/LINK.md"
            target="_blank"
            rel="noopener"
            >部署与连接说明</a
          ></details
        ></section
      ></main
    ><script src="/site.js" type="module"></script
    ><script type="module" src="/backgrounds.js"></script
