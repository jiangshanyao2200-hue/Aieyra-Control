<!doctype html>
<html lang="zh-CN">
  <head
    ><meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1" /><meta
      name="theme-color"
      content="#10191d" /><title>私密反馈 · Aieyra Control</title
    ><meta name="description" content="让 Agent 各就其位，让项目持续生长。" /><link
      rel="stylesheet"
      href="/style.css"
  /></head>
  <body data-page="feedback"
    ><aside class="site-rail"
      ><a class="brand-mark" href="/" aria-label="Aieyra Control"
        ><svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            d="m5 15 11-6 11 6-11 6-11-6Zm0 0v7l11 6 11-6v-7M16 21v7M10 6l12 6v8L10 14V6Z"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linejoin="round"
          /></svg></a
      ><nav aria-label="主导航"
        ><a href="/" aria-label="首页"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 10 8-6 8 6v10H4V10Z M9 20v-7h6v7" /></svg
          ><span>首页</span></a
        ><a href="/share" aria-label="分享"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 5h16v11H9l-5 4V5Z M8 9h8M8 12h5" /></svg
          ><span>分享</span></a
        ><a href="/center" aria-label="中心"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 4h16v12H9l-5 4V4Z M8 8h8 M8 12h5" /></svg
          ><span>中心</span></a
        ><a href="/download" aria-label="下载"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" /></svg
          ><span>下载</span></a
        ></nav
      ><span class="rail-sign" aria-hidden="true">AC</span></aside
    ><main class="feedback-page"
      ><span class="eyebrow">PRIVATE MAINTENANCE</span><h1>问题反馈</h1
      ><p class="feedback-intro">领导工位专用渠道。只提交经过检查的产品诊断，项目内容留在本机。</p
      ><p role="status">正在读取…</p
      ><div class="callback-actions"
        ><button class="text-action" data-login hidden>登录查看</button
        ><button class="text-action" data-feedback-retry>刷新</button></div
      ><ul data-feedback-list class="feedback-list"></ul
      ><p class="feedback-intro"
        >Agent：使用 aieyra_feedback 或
        /api/agent/v1/cloud/feedback。断网时保存在本机，登录后自动重试；官网受理后返回 ACF 编号。</p
      ></main
    ><script src="/site.js" type="module"></script
    ><script src="/feedback.js" type="module"></script></body
></html>
