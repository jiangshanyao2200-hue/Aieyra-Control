name: Linux headless and Link
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - run: python scripts/control.py install-link
      - run: python scripts/control.py doctor
      - name: Exercise headless lifecycle and encrypted station transfer
        env:
          AIEYRA_LINK_TEST_BINARY: ${{ github.workspace }}/runtime/link/aieyra-link
        run: |
          python -m unittest discover -s tests/service -p test_linux_termux.py -v
          python -m unittest discover -s tests/service -p test_device_link.py -v
