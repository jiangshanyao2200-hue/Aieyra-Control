name: macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify native app
        run: python3 scripts/build-macos.py --arch ${{ matrix.arch }} --output build/macos-${{ matrix.arch }} --baseline config/release-baseline.json
      - name: Seal distribution for the authenticated download service
        run: python3 scripts/seal-build.py --input build/macos-${{ matrix.arch }} --key config/artifact-seal-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-macos-${{ matrix.arch }}
          path: |
            build/macos-${{ matrix.arch }}/package.enc
            build/macos-${{ matrix.arch }}/package.key
          retention-days: 2
